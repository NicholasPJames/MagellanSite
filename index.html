<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magellan</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta property="og:title" content="Magellan">
    <meta property="og:description" content="Venture Capital">
    <meta property="og:image" content="https://magellanholdings.co/og-image.png">
    <meta property="og:type" content="website">
    <meta name="description" content="Magellan - Venture Capital">
    <script>(function(){try{var t=localStorage.getItem('magellan-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: var(--bg);
        }
        /* The persistent shell: this frame holds the pages so navigating
           between them never reloads the outer document (or the audio). */
        #viewFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
    <script src="site.js" defer></script>
</head>
<body>

<iframe id="viewFrame" title="Magellan"></iframe>

<script>
(function () {
    var frame = document.getElementById('viewFrame');

    // Friendly hash names <-> actual page files.
    var routeToFile = { '': 'home.html', 'home': 'home.html', 'philosophy': 'philosophy.html', 'login': 'lp.html' };
    var fileToRoute = { 'home.html': 'home', 'philosophy.html': 'philosophy', 'lp.html': 'login' };

    function fileFromHash() {
        var h = location.hash.replace(/^#\/?/, '');
        if (routeToFile.hasOwnProperty(h)) return routeToFile[h];
        if (/\.html$/.test(h)) return h;              // allow direct #philosophy.html
        return 'home.html';
    }

    function currentFile() {
        try {
            var p = frame.contentWindow.location.pathname;
            return p.substring(p.lastIndexOf('/') + 1) || 'home.html';
        } catch (e) {
            return null;                              // not yet loaded
        }
    }

    // Keep the outer URL and title in step with whatever the frame shows.
    frame.addEventListener('load', function () {
        var f = currentFile();
        if (!f) return;
        var route = fileToRoute[f] || f;
        var desired = '#' + route;
        if (location.hash !== desired) {
            history.replaceState(null, '', desired);
        }
        try {
            if (frame.contentDocument && frame.contentDocument.title) {
                document.title = frame.contentDocument.title;
            }
        } catch (e) {}
        // Make sure a freshly loaded page adopts the current theme, even if
        // localStorage was unavailable (e.g. opened via file://).
        try {
            frame.contentWindow.postMessage(
                { type: 'magellan-theme', theme: document.documentElement.getAttribute('data-theme') }, '*');
        } catch (e) {}
    });

    // Back/forward or a manually edited hash swaps the frame's page.
    window.addEventListener('hashchange', function () {
        var want = fileFromHash();
        if (currentFile() !== want) frame.src = want;
    });

    // Initial page.
    frame.src = fileFromHash();
})();
</script>

</body>
</html>
