<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magellan - About</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>(function(){try{var t=localStorage.getItem('magellan-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .wrapper {
            max-width: 800px;
            width: 100%;
            padding: 38vh 20px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 8px;
            margin: 0;
        }
        .header a {
            text-decoration: none;
            color: var(--text);
        }
        .header img {
            width: 160px;
            margin-bottom: 10px;
            border: none;
        }
        .content {
            padding: 20px 0;
            font-size: 15px;
            line-height: 1.8;
        }
        .content h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .content p {
            margin-bottom: 15px;
        }
        a {
            color: var(--accent);
        }
        .footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
        }
        .footer p {
            margin: 0;
        }
    </style>
    <script src="site.js" defer></script>
</head>
<body>

<div class="wrapper">

<div class="header">
    <a href="index.html"><h1>MAGELLAN</h1></a>
</div>

<div class="content">
<p style="text-align: center;">Magellan is a global investment firm, founded in 2026.</p>
</div>

<div class="footer">
    <p>Copyright &copy; 2026 <b>Magellan</b></p>
</div>

</div>

</body>
</html>
